name: Email Subscribe Handler

on:
  repository_dispatch:
    types: [email-subscribe]

jobs:
  save-email:
    runs-on: ubuntu-latest
    steps:
      - name: Save Email to Gist
        uses: actions/github-script@v7
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          script: |
            const email = '${{ github.event.client_payload.email }}';
            const lang = '${{ github.event.client_payload.lang }}' || 'en';
            const timestamp = '${{ github.event.client_payload.timestamp }}' || new Date().toISOString();
            
            const gistId = process.env.GIST_ID;
            
            console.log(`Processing subscription: ${email} (${lang})`);
            
            try {
              // 获取现有 Gist 内容
              const gistResponse = await github.rest.gists.get({
                gist_id: gistId
              });
              
              const existingContent = gistResponse.data.files['emails.txt']?.content || '';
              const newEntry = `${email} | ${timestamp} | ${lang}\n`;
              const newContent = existingContent + newEntry;
              
              // 更新 Gist
              await github.rest.gists.update({
                gist_id: gistId,
                files: {
                  'emails.txt': {
                    content: newContent
                  }
                }
              });
              
              console.log('Email saved successfully!');
            } catch (error) {
              console.error('Error saving email:', error);
              throw error;
            }
