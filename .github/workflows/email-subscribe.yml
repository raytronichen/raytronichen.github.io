name: Email Subscribe

on:
  repository_dispatch:
    types: [email-subscribe]

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const email = '${{ github.event.client_payload.email }}';
            const date = new Date().toISOString();
            const lang = '${{ github.event.client_payload.lang }}' || 'en';
            
            const title = lang === 'zh' 
              ? `邮箱订阅: ${email}`
              : `Email Subscription: ${email}`;
            
            const body = lang === 'zh'
              ? `新的邮箱订阅：\n\n- 邮箱: ${email}\n- 日期: ${date}\n- 来源: 订阅页面`
              : `New email subscription:\n\n- Email: ${email}\n- Date: ${date}\n- Source: Subscribe Page`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['email-subscription']
            });
