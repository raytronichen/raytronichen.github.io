<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导出邮箱列表</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.6;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      background-color: #424242;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #111;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background-color: #f5f5f5;
      border-radius: 4px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .stats {
      margin-top: 10px;
      padding: 10px;
      background-color: #e7f3ff;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>邮箱订阅列表导出工具</h1>
  <p>使用此工具从 Secret Gist 导出所有邮箱订阅。</p>
  
  <div class="input-group">
    <label for="gistId">Gist ID:</label>
    <input type="text" id="gistId" placeholder="输入你的 Gist ID">
  </div>
  
  <div class="input-group">
    <label for="token">GitHub Personal Access Token:</label>
    <input type="password" id="token" placeholder="输入你的 GitHub Token">
  </div>
  
  <button id="fetchBtn" onclick="fetchEmails()">获取邮箱列表</button>
  <button id="exportCsvBtn" onclick="exportCSV()" style="margin-left: 10px;" disabled>导出为 CSV</button>
  
  <div id="result"></div>
  
  <script>
    let emailData = [];
    
    async function fetchEmails() {
      const gistId = document.getElementById('gistId').value.trim();
      const token = document.getElementById('token').value.trim();
      const resultDiv = document.getElementById('result');
      const fetchBtn = document.getElementById('fetchBtn');
      const exportBtn = document.getElementById('exportCsvBtn');
      
      if (!gistId || !token) {
        resultDiv.className = 'result error';
        resultDiv.textContent = '请填写 Gist ID 和 Token';
        return;
      }
      
      fetchBtn.disabled = true;
      fetchBtn.textContent = '获取中...';
      resultDiv.className = 'result';
      resultDiv.textContent = '正在获取数据...';
      
      try {
        const response = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || '获取失败');
        }
        
        const data = await response.json();
        const content = data.files['emails.txt']?.content || '';
        
        // 解析邮箱列表
        emailData = [];
        const lines = content.split('\n').filter(line => line.trim());
        lines.forEach(line => {
          const parts = line.split(' | ');
          if (parts.length >= 2) {
            emailData.push({
              email: parts[0].trim(),
              date: parts[1].trim(),
              lang: parts[2]?.trim() || 'en'
            });
          }
        });
        
        // 显示结果
        resultDiv.className = 'result success';
        let output = `共找到 ${emailData.length} 个邮箱订阅：\n\n`;
        emailData.forEach((item, index) => {
          output += `${index + 1}. ${item.email} | ${item.date} | ${item.lang}\n`;
        });
        resultDiv.textContent = output;
        
        // 显示统计信息
        const statsDiv = document.createElement('div');
        statsDiv.className = 'stats';
        const uniqueEmails = new Set(emailData.map(item => item.email));
        statsDiv.innerHTML = `
          <strong>统计信息：</strong><br>
          总订阅数：${emailData.length}<br>
          唯一邮箱数：${uniqueEmails.size}<br>
          中文订阅：${emailData.filter(item => item.lang === 'zh').length}<br>
          英文订阅：${emailData.filter(item => item.lang === 'en').length}
        `;
        resultDiv.appendChild(statsDiv);
        
        exportBtn.disabled = false;
      } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.textContent = `错误：${error.message}`;
        exportBtn.disabled = true;
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.textContent = '获取邮箱列表';
      }
    }
    
    function exportCSV() {
      if (emailData.length === 0) {
        alert('请先获取邮箱列表');
        return;
      }
      
      // 创建 CSV 内容
      let csv = 'Email,Date,Language\n';
      emailData.forEach(item => {
        csv += `${item.email},${item.date},${item.lang}\n`;
      });
      
      // 下载文件
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `email-subscriptions-${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    
    // 支持 Enter 键提交
    document.getElementById('token').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        fetchEmails();
      }
    });
  </script>
</body>
</html>
