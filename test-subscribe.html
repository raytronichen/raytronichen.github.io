<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试邮箱订阅功能</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.6;
    }
    .test-section {
      margin-bottom: 30px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: #f9f9f9;
    }
    .test-section h2 {
      margin-top: 0;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      background-color: #424242;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-right: 10px;
    }
    button:hover {
      background-color: #111;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 4px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .info {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    code {
      background-color: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>邮箱订阅功能测试工具</h1>
  <p>使用此工具测试 GitHub Gists API 配置是否正确。</p>

  <div class="test-section">
    <h2>步骤 1: 测试 Token 和 Gist ID</h2>
    <div class="input-group">
      <label for="gistId">Gist ID:</label>
      <input type="text" id="gistId" placeholder="输入你的 Gist ID">
    </div>
    <div class="input-group">
      <label for="token">GitHub Personal Access Token:</label>
      <input type="password" id="token" placeholder="输入你的 GitHub Token">
    </div>
    <button onclick="testConnection()">测试连接</button>
    <div id="connectionResult"></div>
  </div>

  <div class="test-section">
    <h2>步骤 2: 测试提交邮箱</h2>
    <div class="input-group">
      <label for="testEmail">测试邮箱:</label>
      <input type="email" id="testEmail" placeholder="test@example.com" value="test@example.com">
    </div>
    <button onclick="testSubmit()">测试提交</button>
    <div id="submitResult"></div>
  </div>

  <div class="test-section">
    <h2>步骤 3: 查看当前邮箱列表</h2>
    <button onclick="viewEmails()">查看所有邮箱</button>
    <div id="emailsResult"></div>
  </div>

  <script>
    function getConfig() {
      return {
        gistId: document.getElementById('gistId').value.trim(),
        token: document.getElementById('token').value.trim()
      };
    }

    function showResult(elementId, message, isError = false, isInfo = false) {
      const div = document.getElementById(elementId);
      div.className = 'result ' + (isError ? 'error' : (isInfo ? 'info' : 'success'));
      div.textContent = message;
    }

    async function testConnection() {
      const { gistId, token } = getConfig();
      
      if (!gistId || !token) {
        showResult('connectionResult', '请填写 Gist ID 和 Token', true);
        return;
      }

      showResult('connectionResult', '正在测试连接...', false, true);

      try {
        const response = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!response.ok) {
          const error = await response.json();
          let errorMsg = '连接失败: ';
          if (response.status === 401) {
            errorMsg += 'Token 无效或已过期';
          } else if (response.status === 404) {
            errorMsg += 'Gist 未找到，请检查 Gist ID';
          } else if (response.status === 403) {
            errorMsg += '权限不足，请检查 Token 是否有 gist 权限';
          } else {
            errorMsg += error.message || `HTTP ${response.status}`;
          }
          showResult('connectionResult', errorMsg, true);
          return;
        }

        const data = await response.json();
        const hasEmailsFile = data.files && data.files['emails.txt'];
        
        let successMsg = '✅ 连接成功！\n\n';
        successMsg += `Gist 描述: ${data.description || '(无)'}\n`;
        successMsg += `创建时间: ${new Date(data.created_at).toLocaleString()}\n`;
        successMsg += `更新时间: ${new Date(data.updated_at).toLocaleString()}\n`;
        successMsg += `是否包含 emails.txt: ${hasEmailsFile ? '是' : '否'}\n`;
        
        if (hasEmailsFile) {
          const content = data.files['emails.txt'].content;
          const lines = content.split('\n').filter(line => line.trim());
          successMsg += `当前邮箱数量: ${lines.length}\n`;
        }

        showResult('connectionResult', successMsg);
      } catch (error) {
        showResult('connectionResult', '连接错误: ' + error.message, true);
      }
    }

    async function testSubmit() {
      const { gistId, token } = getConfig();
      const email = document.getElementById('testEmail').value.trim();

      if (!gistId || !token) {
        showResult('submitResult', '请先填写 Gist ID 和 Token', true);
        return;
      }

      if (!email) {
        showResult('submitResult', '请填写测试邮箱', true);
        return;
      }

      showResult('submitResult', '正在提交...', false, true);

      try {
        // 获取现有内容
        const getResponse = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!getResponse.ok) {
          throw new Error('无法获取 Gist 内容');
        }

        const gistData = await getResponse.json();
        const existingContent = gistData.files['emails.txt']?.content || '';
        const newEntry = `${email} | ${new Date().toISOString()} | test\n`;
        const newContent = existingContent + newEntry;

        // 更新 Gist
        const updateResponse = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            files: {
              'emails.txt': {
                content: newContent
              }
            }
          })
        });

        if (!updateResponse.ok) {
          const error = await updateResponse.json();
          throw new Error(error.message || '更新失败');
        }

        showResult('submitResult', `✅ 提交成功！\n\n邮箱 ${email} 已添加到 Gist。`);
      } catch (error) {
        showResult('submitResult', '提交失败: ' + error.message, true);
      }
    }

    async function viewEmails() {
      const { gistId, token } = getConfig();

      if (!gistId || !token) {
        showResult('emailsResult', '请先填写 Gist ID 和 Token', true);
        return;
      }

      showResult('emailsResult', '正在获取邮箱列表...', false, true);

      try {
        const response = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!response.ok) {
          throw new Error('获取失败');
        }

        const data = await response.json();
        const content = data.files['emails.txt']?.content || '';

        if (!content.trim()) {
          showResult('emailsResult', 'Gist 中没有邮箱数据。');
          return;
        }

        const lines = content.split('\n').filter(line => line.trim());
        let result = `共找到 ${lines.length} 个邮箱订阅：\n\n`;
        
        lines.forEach((line, index) => {
          const parts = line.split(' | ');
          result += `${index + 1}. ${parts[0] || '(无邮箱)'} | ${parts[1] || '(无日期)'} | ${parts[2] || 'en'}\n`;
        });

        showResult('emailsResult', result);
      } catch (error) {
        showResult('emailsResult', '获取失败: ' + error.message, true);
      }
    }
  </script>
</body>
</html>
